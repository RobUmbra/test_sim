<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Testing Environment</title>
    
    <!-- MathJax for rendering LaTeX -->
    <script>
      MathJax = {
        tex: { inlineMath: [['$', '$']] },
        startup: { typeset: false } // We will trigger typesetting manually after loading the file
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }
        #banner {
            background-color: #e9ecef;
            color: #333;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
        }
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        #timer {
            font-size: 24px;
            font-weight: bold;
            color: black;
        }
        .red {
            color: red !important;
        }
        .problem-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        .problem-text {
            flex: 1;
            margin-right: 30px;
        }
        .answer-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Using type="text" instead of number removes browser clicker arrows */
        input[type="text"].answer-input {
            width: 80px;
            font-size: 18px;
            padding: 5px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .answer-text {
            font-size: 18px;
            font-weight: bold;
            color: #0056b3;
        }
        #results-page {
            display: none;
        }
    </style>
</head>
<body>

    <div id="test-page">
        <div id="banner">Problems loaded from: <strong>problems.tex</strong></div>
        
        <div id="header">
            <h2>Math Assessment</h2>
            <div id="timer">10:00</div>
        </div>

        <div id="problems-container">
            <!-- Problems will be injected here via JavaScript -->
        </div>
    </div>

    <div id="results-page">
        <div id="banner">Results for: <strong>problems.tex</strong></div>
        <h2>Time Expired: Test Results</h2>
        <div id="results-container"></div>
    </div>

    <script>
        const fileName = 'problems.tex';
        const problemsContainer = document.getElementById('problems-container');
        let problemCount = 0;

        // Fetch and parse the .tex file
        fetch(fileName)
            .then(response => {
                if (!response.ok) throw new Error("Could not load " + fileName);
                return response.text();
            })
            .then(text => {
                // Split the text file by the "**Problem X**" formatting
                const problemBlocks = text.split(/(?=\*\*Problem \d+\*\*)/g);
                
                problemBlocks.forEach((block, index) => {
                    if (block.trim() === '') return;
                    problemCount++;
                    
                    // Format bold text for HTML if needed, though MathJax/Markdown might need manual HTML adjustment
                    // Convert "**Problem X**" to HTML strong tags
                    let formattedBlock = block.replace(/\*\*(Problem \d+)\*\*/g, '<strong>$1</strong><br>');
                    
                    const problemRow = document.createElement('div');
                    problemRow.className = 'problem-row';
                    problemRow.innerHTML = `
                        <div class="problem-text" id="prob-${problemCount}-text">
                            ${formattedBlock}
                        </div>
                        <div class="answer-box">
                            <input type="text" class="answer-input" id="prob-${problemCount}-input" 
                                maxlength="3" placeholder="000" 
                                oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                        </div>
                    `;
                    problemsContainer.appendChild(problemRow);
                });

                // Trigger MathJax to render the newly injected LaTeX
                if (window.MathJax) {
                    MathJax.typesetPromise();
                }
            })
            .catch(error => {
                problemsContainer.innerHTML = `<p style="color:red;">Error: Make sure the file <strong>${fileName}</strong> is in the same directory and hosted correctly on GitHub Pages.</p>`;
                console.error(error);
            });

        // Timer Logic
        let timeLeft = 600; // 10 minutes
        const timerElement = document.getElementById('timer');
        const testPage = document.getElementById('test-page');
        const resultsPage = document.getElementById('results-page');
        const resultsContainer = document.getElementById('results-container');

        const timerInterval = setInterval(() => {
            timeLeft--;
            
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            
            timerElement.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

            if (timeLeft < 60) {
                timerElement.classList.add('red');
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                finishTest();
            }
        }, 1000);

        function finishTest() {
            testPage.style.display = 'none';
            resultsPage.style.display = 'block';

            for (let i = 1; i <= problemCount; i++) {
                const probText = document.getElementById(`prob-${i}-text`).innerHTML;
                const userInput = document.getElementById(`prob-${i}-input`).value;
                const formattedAnswer = userInput === "" ? "No Answer" : userInput.padStart(3, '0');

                const resultRow = document.createElement('div');
                resultRow.className = 'problem-row';
                resultRow.innerHTML = `
                    <div class="problem-text">${probText}</div>
                    <div class="answer-text">Answer entered: ${formattedAnswer}</div>
                `;
                resultsContainer.appendChild(resultRow);
            }
        }
    </script>
</body>
</html>
